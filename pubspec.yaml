name: perruques_salon
description: Gestion salon de coiffure feminine et vente de perruques - Burkina Faso
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  provider: ^6.1.1
  crypto: ^3.0.3
  bcrypt: ^1.1.3
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  sqflite_common_ffi_web: ^1.2.0
  web: ^1.1.1
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^11.0.3
  supabase_flutter: ^2.18.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#E11D48"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#E11D48"
    theme_color: "#E11D48"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
